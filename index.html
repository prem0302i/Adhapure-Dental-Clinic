<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dental Clinic — Gentle, Trusted Dental Care</title>
    <meta
      name="description"
      content="Dental clinic offering trusted, patient-focused dental care. Request an appointment or enquire by WhatsApp."
    />
    <!-- Instantly apply the saved clinic name from cache before React mounts -->
    <script>
      try {
        var cached = localStorage.getItem('clinic_cache_settings');
        if (cached) {
          var s = JSON.parse(cached);
          if (s && s.name && s.name.trim()) {
            document.title = 'Gentle, Trusted Dental Care \u2014 ' + s.name.trim();
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
